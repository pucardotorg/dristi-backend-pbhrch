# AUTO-GENERATED by scripts/migration/config_consolidation/run_consolidation.py
# Per-subdomain overlay for epost-tracker (subdomain=epost).
# Lives in domain-integration/src/main/resources/ so its config travels with the
# domain-integration module.
# Includes service-unique keys + this service's value for any key that conflicts across services.
# Activate via spring.profiles.active=...,epost,...

otel:
  instrumentation:
    http:
      server:
        ignore-urls: /epost-tracker/health,/epost-tracker/prometheus
kafka:
  consumer:
    config:
      auto_commit: true
      auto_commit_interval: 100
      session_timeout: 15000
      auto_offset_reset: earliest
  producer:
    config:
      retries_config: 0
      batch_size_config: 16384
      linger_ms_config: 1
      buffer_memory_config: 33554432
egov-state-level-tenant-id: pb
egov:
  idgen:
    host: http://egov-idgen:8080
    path: /egov-idgen/id/_generate
    name: epost.sh
  summons:
    host: http://egov-summons:8080
    update:
      endpoint: /summons-svc/summons/v1/_updateSummons
  mdms:
    host: http://localhost:8090
    search:
      endpoint: /egov-mdms-service/v1/_search
    epost:
      module:
        name: Epost
      master:
        name: PostalHubs
      username:
        module:
          name: Epost
        master:
          name: PostalHubAndUserName
  filestore:
    host: http://localhost:8082
    module: epost-report
  file:
    store:
      save:
        endpoint: /filestore/v1/files
  pdf:
    service:
      host: http://localhost:8087
      create:
        endpoint: /pdf-service/v1/_createnosave
      template:
        key: ePostMonthlyReport
  user:
    host: http://localhost:7090
    create:
      path: /user/users/_createnovalidate
    search:
      path: /user/v1/_search
get:
  data:
    based:
      user:
        logged:
          in: true
default:
